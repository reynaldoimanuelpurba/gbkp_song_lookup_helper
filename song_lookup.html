function lookupTitle(type, num) {
  const book = SONGS[type.toUpperCase()];
  if (!book) return null;
  return book[String(num)] || null;
}

function generate() {
  const raw = document.getElementById('input').value;
  const lines = raw.split('\n');
  const results = [];
  let maxPrefix = 0;

  const parsed = lines.map(line => {
    const trimmed = line.trim();
    if (!trimmed) return null;

    // Match: TYPE No. NUM : AYAT -- KETERANGAN
    const m = trimmed.match(/^(KJ|PKJ|NKB|KEE)\s+No\.?\s*(\d+)\s*(?::([^\-]*))?(?:--\s*(.*))?$/i);
    if (!m) return { raw: trimmed, error: true };

    const type = m[1].toUpperCase();
    const num = m[2];
    const ayat = m[3] ? m[3].trim().replace(/\s+/g, '') : '';
    const ket = m[4] ? m[4].trim() : '';
    const title = lookupTitle(type, num);

    return { type, num, ayat, ket, title };
  });

  // Calculate column widths for alignment
  const validRows = parsed.filter(p => p && !p.error);
  let maxTypeLen = 0, maxNumLen = 0, maxAyatLen = 0;
  validRows.forEach(p => {
    maxTypeLen = Math.max(maxTypeLen, p.type.length);
    maxNumLen = Math.max(maxNumLen, p.num.length);
    const ayatStr = p.ayat ? ': ' + p.ayat : ':';
    maxAyatLen = Math.max(maxAyatLen, ayatStr.length);
  });

  const outputLines = parsed.map(p => {
    if (!p) return '';
    if (p.error) return `⚠️  Tidak dikenali: ${p.raw}`;

    const typeStr = p.type.padEnd(maxTypeLen);
    const numStr = ('No. ' + p.num).padEnd(4 + maxNumLen);
    const ayatStr = (p.ayat ? p.ayat : '').padEnd(maxAyatLen);
    const ketStr = p.ket ? ` (${p.ket})` : '';
    const titleStr = p.title ? '  ' + p.title : '  [tidak ditemukan]';

    return `${typeStr} ${numStr} : ${ayatStr}${titleStr}${ketStr}`;
  });

  const outputEl = document.getElementById('output');
  const outputSection = document.getElementById('outputSection');
  const btnCopy = document.getElementById('btnCopy');

  outputEl.innerHTML = '';
  outputSection.style.display = 'block';

  const text = outputLines.join('\n');
  outputEl.textContent = text;

  btnCopy.style.display = text.trim() ? 'inline-block' : 'none';
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2000);
  });
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').textContent = '';
  document.getElementById('outputSection').style.display = 'none';
  document.getElementById('btnCopy').style.display = 'none';
}
</script>
</body>
</html>
